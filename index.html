<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokeGPT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);color:#212529}
.card{text-align:center;padding:3rem 2rem}
.ball{width:72px;height:72px;margin:0 auto 1.5rem;border-radius:50%;background:linear-gradient(to bottom,#ee1515 0 46%,#222 46% 54%,#fff 54% 100%);border:4px solid #222;position:relative}
.ball::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:#fff;border:4px solid #222;border-radius:50%}
h1{font-size:3rem;letter-spacing:.1em;margin-bottom:.75rem}
h1 span{color:#ee1515}
p{color:#6c757d;font-size:1.1rem}
.domain{margin-top:2rem;font-size:.85rem;color:#adb5bd}
</style>
</head>
<body>
<div class="card">
<div class="ball"></div>
<h1>Poke<span>GPT</span></h1>
<p>正在孵化中 · Coming soon</p>
<div class="domain">pokegpt.duckdns.org</div>
</div>
</body>
</html>
